# Server Configuration
server.port=8080

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:clipmind_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:}

# JPA / Hibernate Configuration
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=never
# Use Spring Boot auto-detection for SQL dialect when possible

# Multipart File Upload Configuration
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# Custom Security/JWT Configuration
# Base64 encoded secret key for HS512 (must be at least 512 bits / 64 bytes).
# Below is a safe pre-generated key: "clipmind_ai_processing_platform_secure_jwt_secret_key_2026_spring_boot_react_ffmpeg_milestone"
clipmind.jwt.secret=clipmind_ai_processing_platform_secure_jwt_secret_key_2026_spring_boot_react_ffmpeg_milestone
clipmind.jwt.expiration-ms=86400000

# Storage Directories
clipmind.upload.dir=uploads

# FFmpeg Configurations (Defaults to system environment paths, override if necessary)
clipmind.ffmpeg.path=ffmpeg
clipmind.ffprobe.path=ffprobe
