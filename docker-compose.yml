version: '3.8'

services:
  # MySQL Database Container
  db:
    image: mysql:8.0
    container_name: clipmind-db
    restart: always
    environment:
      MYSQL_DATABASE: clipmind_db
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_USER: clipmind_user
      MYSQL_PASSWORD: clipmind_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - clipmind-network

  # Spring Boot Backend with FFmpeg
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: clipmind-backend
    restart: always
    depends_on:
      - db
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/clipmind_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: clipmind_user
      SPRING_DATASOURCE_PASSWORD: clipmind_pass
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      CLIPMIND_JWT_SECRET: clipmind_ai_processing_platform_secure_jwt_secret_key_2026_spring_boot_react_ffmpeg_milestone
      CLIPMIND_FFMPEG_PATH: ffmpeg
      CLIPMIND_FFPROBE_PATH: ffprobe
    ports:
      - "8080:8080"
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - clipmind-network

  # Next.js / React Frontend with Nginx Reverse Proxy
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: clipmind-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - clipmind-network

networks:
  clipmind-network:
    driver: bridge

volumes:
  db_data:
  backend_uploads: