# ==============================================================================
# ClipMind AI — Render Cloud All-in-One Deployment Blueprint Specification
# Docs: https://render.com/docs/blueprint-spec
# Single-Service Full-Stack Deployment (React 19 Frontend + FastAPI Backend)
# ==============================================================================

services:
  - type: web
    name: clipmind-all-in-one
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: 10000
      - key: SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 10080
      - key: MONGODB_URL
        sync: false # Set in Render Dashboard: mongodb+srv://<user>:<password>@cluster.mongodb.net/?retryWrites=true&w=majority
      - key: MONGODB_DB_NAME
        value: clipmind_db
      - key: WHISPER_CLOUD_ENABLED
        value: "true"
      - key: GROQ_API_KEY
        sync: false # Optional: Groq API key for cloud LLM acceleration
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: ANALYTICS_ZERO_BASELINE
        value: "true"
      - key: CORS_ORIGINS
        value: "*"
      - key: GOOGLE_CLIENT_ID
        sync: false # Set in Render Dashboard: Google Cloud OAuth Client ID
      - key: GOOGLE_CLIENT_SECRET
        sync: false # Set in Render Dashboard: Google Cloud OAuth Client Secret
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false # Set in Render Dashboard: Google Cloud OAuth Client ID for frontend



